<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Jev Guard icon: shield + check on a dark squircle. Single source of
       truth — make-macos-app.sh renders this to every .icns size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182741"/>
      <stop offset="1" stop-color="#0B3B39"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA472"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <path d="M512 188 C562 236 644 256 736 266 L736 522 C736 702 632 812 512 864 C392 812 288 702 288 522 L288 266 C380 256 462 236 512 188 Z"
        fill="url(#shield)"/>
  <path d="M430 534 L490 594 L606 446" fill="none" stroke="#F8FAFC"
        stroke-width="62" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
