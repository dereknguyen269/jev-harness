# Developer profile: permissive for daily work.
groups:
  - name: critical-safety
    description: Irreversible destructive commands (always block)
  - name: privileged-ops
    description: Elevated or production-affecting operations (ask)
policies:
  - id: root-delete
    group: critical-safety
    category: safety
    description: Irreversible root delete
    match:
      tool: terminal
      command:
        regex: 'rm\s+-rf\s+/'
    decision:
      action: block
      risk: 1.0
      reason_code: CRITICAL_DELETE
  - id: sudo
    group: privileged-ops
    category: safety
    description: Elevated privileges
    match:
      tool: terminal
      command:
        regex: '\bsudo\b'
    decision:
      action: approval_required
      risk: 0.8
      reason_code: PRIVILEGED
  - id: production
    category: safety
    description: Production environment mutation
    match:
      context:
        environment: production
    decision:
      action: approval_required
      risk: 0.9
      reason_code: PROD_MUTATION
  - id: git-read
    group: git
    category: productivity
    description: Read-only git inspection
    match:
      tool: terminal
      command:
        regex: '^git\s+(status|diff|log)'
    decision:
      action: allow
      risk: 0.05
      reason_code: READ
